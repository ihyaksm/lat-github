<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8ed8ff">
    <title>Awan Semangat — Kata-Kata Motivasi</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
            color: #173c60;
            background: #8ed8ff;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background:
                radial-gradient(ellipse at 50% 112%, #fff8cc 0, transparent 34%),
                linear-gradient(180deg, #72caff 0%, #b4eaff 58%, #e8faff 100%);
        }

        body.paused *,
        body.paused *::before,
        body.paused *::after {
            animation-play-state: paused !important;
        }

        .sky {
            position: relative;
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 48px 24px;
            isolation: isolate;
        }

        .sun {
            position: absolute;
            z-index: -1;
            top: 8%;
            right: 12%;
            width: clamp(72px, 11vw, 132px);
            aspect-ratio: 1;
            border-radius: 50%;
            box-shadow: 0 0 70px 18px #fff3ad8c;
            animation: sun-glow 4s ease-in-out infinite alternate;
        }

        .sun::before,
        .sun::after {
            position: absolute;
            border-radius: 50%;
            content: "";
        }

        .sun::before {
            z-index: 0;
            inset: 0;
            background: repeating-conic-gradient(#ffdf66 0deg 7deg, transparent 7deg 20deg);
            mask: radial-gradient(circle, transparent 0 59%, #000 62% 100%);
            animation: rays-spin 36s linear infinite;
        }

        .sun::after {
            z-index: 1;
            inset: 15%;
            background: #fff3ad;
            box-shadow: inset 0 -5px 12px #ffd65b65;
        }

        .sunglasses {
            position: absolute;
            z-index: 2;
            top: 39%;
            left: 13%;
            width: 74%;
            height: 25%;
        }

        .sunglasses::before,
        .sunglasses::after {
            position: absolute;
            top: 0;
            width: 44%;
            height: 100%;
            border: 2px solid #263d53;
            border-radius: 35% 35% 48% 48%;
            background: linear-gradient(145deg, #53677a, #172b40 70%);
            box-shadow: inset 0 2px 3px #ffffff70;
            content: "";
        }

        .sunglasses::before {
            left: 0;
        }

        .sunglasses::after {
            right: 0;
        }

        .bridge {
            position: absolute;
            top: 24%;
            left: 42%;
            width: 16%;
            height: 3px;
            border-radius: 3px;
            background: #263d53;
        }

        .sparkle {
            position: absolute;
            z-index: 2;
            width: 12%;
            aspect-ratio: 1;
            background: #fff;
            clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
            animation: sparkle 1.8s ease-in-out infinite alternate;
        }

        .sparkle-one {
            top: 8%;
            left: 13%;
        }

        .sparkle-two {
            right: 4%;
            bottom: 23%;
            width: 9%;
            animation-delay: -.9s;
        }

        .little-cloud {
            position: absolute;
            z-index: -1;
            width: 130px;
            height: 34px;
            border-radius: 40px;
            background: #ffffffa8;
            filter: drop-shadow(0 8px 12px #499bd126);
            animation: float-across 24s linear infinite;
        }

        .little-cloud::before,
        .little-cloud::after {
            position: absolute;
            bottom: 10px;
            border-radius: 50%;
            background: inherit;
            content: "";
        }

        .little-cloud::before {
            left: 20px;
            width: 54px;
            height: 54px;
        }

        .little-cloud::after {
            right: 17px;
            width: 40px;
            height: 40px;
        }

        .cloud-one {
            top: 17%;
            left: -150px;
        }

        .cloud-two {
            top: 72%;
            left: -170px;
            transform: scale(.72);
            animation-delay: -12s;
            animation-duration: 30s;
        }

        .content {
            width: min(100%, 900px);
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 17px;
            color: #347eaa;
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .eyebrow::before,
        .eyebrow::after {
            width: 22px;
            height: 1px;
            background: currentColor;
            content: "";
        }

        h1 {
            margin: 0;
            color: #17466c;
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -.055em;
            line-height: 1.05;
        }

        .intro {
            margin: 14px 0 0;
            color: #386b8d;
            font-size: clamp(.95rem, 2vw, 1.1rem);
            line-height: 1.6;
        }

        .cloud-wrap {
            position: relative;
            display: grid;
            min-height: 390px;
            margin: 12px auto 0;
            place-items: center;
        }

        .word-cloud {
            position: relative;
            display: flex;
            width: min(100%, 760px);
            min-height: 320px;
            align-content: center;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px 17px;
            padding: 76px 70px;
            isolation: isolate;
            animation: cloud-drift 6s ease-in-out infinite;
        }

        .word-cloud::before {
            position: absolute;
            z-index: -2;
            inset: 30% 5% 13%;
            border-radius: 50%;
            background: linear-gradient(180deg, #fff 0%, #f5fcff 100%);
            box-shadow: 0 24px 55px #398bb52c, inset 0 -7px 18px #c5ebf561;
            content: "";
        }

        .word-cloud::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(ellipse at 26% 47%, #fff 0 17%, transparent 17.5%),
                radial-gradient(ellipse at 38% 31%, #fff 0 23%, transparent 23.5%),
                radial-gradient(ellipse at 57% 28%, #fff 0 25%, transparent 25.5%),
                radial-gradient(ellipse at 75% 42%, #fff 0 18%, transparent 18.5%),
                radial-gradient(ellipse at 87% 54%, #fff 0 12%, transparent 12.5%);
            filter: drop-shadow(0 22px 18px #398bb526);
            content: "";
        }

        .word {
            display: inline-block;
            color: #3284a9;
            font-size: clamp(.9rem, 2vw, 1.25rem);
            font-weight: 700;
            line-height: 1.4;
            animation: word-bob 3s ease-in-out infinite alternate;
            animation-delay: var(--delay, 0s);
        }

        .word:nth-child(3n) {
            color: #ed9460;
        }

        .word:nth-child(4n) {
            color: #4a9b79;
        }

        .word.small {
            font-size: clamp(.75rem, 1.7vw, 1rem);
            font-weight: 600;
        }

        .word.big {
            color: #20577d;
            font-size: clamp(1.45rem, 4vw, 2.45rem);
            font-weight: 900;
            letter-spacing: -.04em;
        }

        .word.hero-word {
            width: 100%;
            color: #ed8058;
            font-size: clamp(1.7rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: .04em;
            line-height: 1.1;
            text-shadow: 0 3px 0 #ffdec6;
        }

        .closing {
            margin: 0;
            color: #386b8d;
            font-size: clamp(.95rem, 2vw, 1.12rem);
            font-weight: 600;
        }

        .closing strong {
            color: #e27e58;
        }

        .controls {
            margin-top: 21px;
        }

        button {
            min-height: 44px;
            padding: 10px 19px;
            border: 1px solid #ffffffb3;
            border-radius: 999px;
            background: #ffffff80;
            box-shadow: 0 5px 16px #397ea51c;
            color: #245c7d;
            font: inherit;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .2s ease, transform .2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: #fff;
        }

        button:focus-visible {
            outline: 3px solid #ed8058;
            outline-offset: 3px;
        }

        @keyframes cloud-drift {
            0%, 100% { transform: translateY(0) rotate(-.5deg); }
            50% { transform: translateY(-10px) rotate(.5deg); }
        }

        @keyframes word-bob {
            from { transform: translateY(3px); }
            to { transform: translateY(-4px); }
        }

        @keyframes sun-glow {
            from { box-shadow: 0 0 55px 12px #fff3ad70; }
            to { box-shadow: 0 0 85px 25px #fff3adab; }
        }

        @keyframes rays-spin {
            to { rotate: 1turn; }
        }

        @keyframes sparkle {
            from { opacity: .45; scale: .7; rotate: 0deg; }
            to { opacity: 1; scale: 1.15; rotate: 25deg; }
        }

        @keyframes float-across {
            from { translate: 0; }
            to { translate: calc(100vw + 220px); }
        }

        @media (max-width: 600px) {
            .sky {
                padding: 35px 16px;
            }

            .sun {
                top: 5%;
                right: 5%;
            }

            .cloud-wrap {
                min-height: 320px;
                margin-top: 0;
            }

            .word-cloud {
                min-height: 285px;
                gap: 4px 10px;
                padding: 58px 25px;
            }

            .word-cloud::before {
                inset: 31% 1% 14%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="sky">
        <div class="sun" aria-hidden="true">
            <span class="sunglasses"><span class="bridge"></span></span>
            <span class="sparkle sparkle-one"></span>
            <span class="sparkle sparkle-two"></span>
        </div>
        <div class="little-cloud cloud-one" aria-hidden="true"></div>
        <div class="little-cloud cloud-two" aria-hidden="true"></div>

        <section class="content" aria-labelledby="page-title">
            <p class="eyebrow">Langit penuh harapan</p>
            <h1 id="page-title">Awan Semangat</h1>
            <p class="intro">Tarik napas, percaya pada dirimu, lalu terus melangkah.</p>

            <div class="cloud-wrap">
                <div class="word-cloud" aria-label="Kumpulan kata-kata motivasi">
                    <span class="word small" style="--delay: -.6s">Bermimpi</span>
                    <span class="word big" style="--delay: -.2s">Berani</span>
                    <span class="word small" style="--delay: -1.1s">Bersyukur</span>
                    <span class="word" style="--delay: -.9s">Jangan menyerah</span>
                    <span class="word hero-word" style="--delay: -.4s">KAMU BISA!</span>
                    <span class="word small" style="--delay: -.8s">Satu langkah</span>
                    <span class="word big" style="--delay: -1.3s">Hebat</span>
                    <span class="word" style="--delay: -.1s">Tetap tumbuh</span>
                    <span class="word small" style="--delay: -1s">Penuh harapan</span>
                    <span class="word" style="--delay: -.7s">Coba lagi</span>
                    <span class="word big" style="--delay: -.3s">Semangat</span>
                    <span class="word small" style="--delay: -1.2s">Percaya diri</span>
                    <span class="word" style="--delay: -.5s">Masa depan cerah</span>
                </div>
            </div>

            <p class="closing">Hari ini, jadilah <strong>versi terbaik dirimu.</strong></p>
            <div class="controls">
                <button id="motion-toggle" type="button" aria-pressed="false">Jeda animasi</button>
            </div>
        </section>
    </main>

    <script>
        const toggle = document.querySelector("#motion-toggle");

        toggle.addEventListener("click", () => {
            const paused = document.body.classList.toggle("paused");
            toggle.setAttribute("aria-pressed", String(paused));
            toggle.textContent = paused ? "Lanjutkan animasi" : "Jeda animasi";
        });
    </script>
</body>
</html>
